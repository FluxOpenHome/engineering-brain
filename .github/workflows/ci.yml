name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: eb, POSTGRES_PASSWORD: eb, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eb" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd backend && uv sync --all-groups && uv pip install -e .
      - run: cd backend && .venv/bin/ruff check src tests
      - run: cd backend && .venv/bin/pytest -q
        env:
          EB_TEST_ADMIN_URL: postgresql://eb:eb@localhost:5432/postgres
          EB_TEST_DATABASE_URL: postgresql://eb:eb@localhost:5432/engineering_brain_test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci && npm run lint && npm run build
