[project]
name = "engineering-brain"
version = "0.1.0"
description = "Engineering Brain: document ingestion, reviewed wiki, cited chat, and compliance checking for multi-disciplinary engineering."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=0.60",
  "httpx>=0.27",
  "pypdf>=5.0",
  "python-frontmatter>=1.1",
  "pint>=0.24",
  "numpy>=2.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "structlog>=24.1",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]

[project.scripts]
eb = "eb.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eb"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends/File/Form in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
